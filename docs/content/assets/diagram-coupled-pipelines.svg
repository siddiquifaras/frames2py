<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Two coupled event pipelines and what a slow consumer does to them</title>
  <desc id="desc">Two illustrative arrangements, not every design. First: consumer work runs inside the processing loop, so the loop runs at the consumer's speed and unread events back up at the source. Second: a queue sits between producer and consumer; unbounded, it grows and the consumer works on ever older frames; bounded and blocking, the producer waits; bounded and dropping, the policy decides which frames survive.</desc>
  <style>
    .bg { fill: #FFFFFF; stroke: #D5DAE5; }
    .box { fill: #F4F6FA; stroke: #1D2433; stroke-width: 1.5; }
    .slow { fill: #FDECEA; stroke: #B3261E; stroke-width: 1.5; }
    .region { fill: none; stroke: #5B6478; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .cell { fill: #FFFFFF; stroke: #1D2433; stroke-width: 1.2; }
    .backlog { fill: #FDECEA; stroke: #B3261E; stroke-width: 1.2; }
    .line { fill: none; stroke: #1D2433; stroke-width: 1.5; }
    .warnline { fill: none; stroke: #B3261E; stroke-width: 1.5; }
    .head { fill: #1D2433; }
    .warnhead { fill: #B3261E; }
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; fill: #1D2433; }
    .title { font-size: 22px; font-weight: 600; }
    .h { font-size: 19px; font-weight: 600; }
    .muted { fill: #5B6478; }
    .warn { fill: #B3261E; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161B26; stroke: #2E3546; }
      .box { fill: #1F2533; stroke: #E7EBF3; }
      .slow { fill: #3A1F22; stroke: #FF8A80; }
      .region { stroke: #A3ABBD; }
      .cell { fill: #161B26; stroke: #E7EBF3; }
      .backlog { fill: #3A1F22; stroke: #FF8A80; }
      .line { stroke: #E7EBF3; }
      .warnline { stroke: #FF8A80; }
      .head { fill: #E7EBF3; }
      .warnhead { fill: #FF8A80; }
      text { fill: #E7EBF3; }
      .muted { fill: #A3ABBD; }
      .warn { fill: #FF8A80; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="warnhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="759" rx="8"/>
  <text class="title" x="24" y="38">Coupled pipelines: two common ways a slow consumer affects the stream</text>
  <text class="muted" x="24" y="66">Illustrative arrangements, not every design. Each ties the slow step to the stream in a</text>
  <text class="muted" x="24" y="88">different way.</text>

  <!-- Panel 1: consumer work inside the loop -->
  <text class="h" x="24" y="132">1. Consumer work inside the processing loop</text>
  <rect class="box" x="24" y="162" width="176" height="90" rx="6"/>
  <text x="112" y="188" text-anchor="middle">event source</text>
  <text class="muted" x="112" y="212" text-anchor="middle">camera SDK, file,</text>
  <text class="muted" x="112" y="234" text-anchor="middle">network: high rate</text>

  <rect class="backlog" x="220" y="222" width="48" height="14"/>
  <rect class="backlog" x="220" y="206" width="48" height="14"/>
  <rect class="backlog" x="220" y="190" width="48" height="14"/>
  <rect class="backlog" x="220" y="174" width="48" height="14"/>
  <text class="warn" x="244" y="262" text-anchor="middle">backlog</text>
  <line class="line" x1="200" y1="206" x2="216" y2="206" marker-end="url(#a)"/>
  <line class="line" x1="268" y1="206" x2="306" y2="206" marker-end="url(#a)"/>

  <rect class="region" x="310" y="148" width="420" height="152" rx="8"/>
  <text class="muted" x="324" y="170">one thread, one loop</text>
  <rect class="box" x="326" y="184" width="166" height="60" rx="6"/>
  <text x="409" y="208" text-anchor="middle">accumulate</text>
  <text class="muted" x="409" y="232" text-anchor="middle">a batch of events</text>
  <line class="line" x1="492" y1="214" x2="520" y2="214" marker-end="url(#a)"/>
  <rect class="slow" x="524" y="184" width="190" height="60" rx="6"/>
  <text x="619" y="208" text-anchor="middle">consumer work</text>
  <text class="warn" x="619" y="232" text-anchor="middle">display, model: slow</text>
  <path class="line" d="M619,244 L619,262 L409,262 L409,248" marker-end="url(#a)"/>
  <text class="muted" x="514" y="288" text-anchor="middle">next batch only after the slow step</text>

  <text x="24" y="336">The loop takes new events only between slow steps, so it runs at the consumer's speed.</text>
  <text class="warn" x="24" y="358">Unread events wait upstream (backpressure) until the source's buffer is full; then they</text>
  <text class="warn" x="24" y="380">are lost.</text>

  <!-- Panel 2: a queue between producer and consumer -->
  <text class="h" x="24" y="432">2. A queue between producer and consumer</text>
  <rect class="box" x="24" y="460" width="176" height="90" rx="6"/>
  <text x="112" y="486" text-anchor="middle">event source</text>
  <text class="muted" x="112" y="510" text-anchor="middle">camera SDK, file,</text>
  <text class="muted" x="112" y="532" text-anchor="middle">network: high rate</text>
  <line class="line" x1="200" y1="505" x2="228" y2="505" marker-end="url(#a)"/>

  <rect class="box" x="232" y="460" width="172" height="90" rx="6"/>
  <text x="318" y="486" text-anchor="middle">producer</text>
  <text class="muted" x="318" y="510" text-anchor="middle">accumulate, then</text>
  <text class="muted" x="318" y="532" text-anchor="middle">enqueue a frame</text>
  <line class="line" x1="404" y1="505" x2="432" y2="505" marker-end="url(#a)"/>

  <rect class="cell" x="436" y="483" width="46" height="44"/>
  <rect class="cell" x="482" y="483" width="46" height="44"/>
  <rect class="cell" x="528" y="483" width="46" height="44"/>
  <rect class="cell" x="574" y="483" width="46" height="44"/>
  <rect class="cell" x="620" y="483" width="46" height="44"/>
  <text class="mono" x="459" y="511" text-anchor="middle">f6</text>
  <text class="mono" x="505" y="511" text-anchor="middle">f5</text>
  <text class="mono" x="551" y="511" text-anchor="middle">f4</text>
  <text class="mono" x="597" y="511" text-anchor="middle">f3</text>
  <text class="mono" x="643" y="511" text-anchor="middle">f2</text>
  <text class="muted" x="551" y="472" text-anchor="middle">queue: newest on the left</text>
  <line class="warnline" x1="482" y1="566" x2="440" y2="566" marker-end="url(#w)"/>
  <text class="warn" x="490" y="572">grows while the consumer lags</text>
  <line class="line" x1="666" y1="505" x2="694" y2="505" marker-end="url(#a)"/>

  <rect class="slow" x="698" y="460" width="190" height="90" rx="6"/>
  <text x="793" y="486" text-anchor="middle">slow consumer</text>
  <text class="warn" x="793" y="510" text-anchor="middle">works on f1, the</text>
  <text class="warn" x="793" y="532" text-anchor="middle">oldest frame</text>

  <text x="24" y="614"><tspan font-weight="600">Unbounded:</tspan> memory grows without limit, and the consumer works on ever older frames,</text>
  <text x="24" y="636">so its view of the sensor falls further behind the stream (stale state).</text>
  <text x="24" y="666"><tspan font-weight="600">Bounded and blocking:</tspan> the producer waits while the queue is full, which is</text>
  <text x="24" y="688">backpressure again.</text>
  <text x="24" y="718"><tspan font-weight="600">Bounded and dropping:</tspan> memory stays fixed; which frames the consumer sees depends on</text>
  <text x="24" y="740">the queue's policy.</text>
</svg>
