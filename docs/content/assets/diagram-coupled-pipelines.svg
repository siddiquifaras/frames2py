<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Two coupled event pipelines and what a slow consumer does to them</title>
  <desc id="desc">Two illustrative arrangements, not every design. First: consumer work runs inside the processing loop, so the loop runs at the consumer's speed and unread events back up at the source. Second: a queue sits between producer and consumer; unbounded, it grows and the consumer works on ever older frames; bounded and blocking, the producer waits; bounded and dropping, the policy decides which frames survive.</desc>
  <style>
    .bg { fill: #FFFFFF; stroke: #D5DAE5; }
    .box { fill: #F4F6FA; stroke: #1D2433; stroke-width: 1.5; }
    .slow { fill: #FDECEA; stroke: #B3261E; stroke-width: 1.5; }
    .region { fill: none; stroke: #5B6478; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .cell { fill: #FFFFFF; stroke: #1D2433; stroke-width: 1.2; }
    .backlog { fill: #FDECEA; stroke: #B3261E; stroke-width: 1.2; }
    .line { fill: none; stroke: #1D2433; stroke-width: 1.5; }
    .warnline { fill: none; stroke: #B3261E; stroke-width: 1.5; }
    .head { fill: #1D2433; }
    .warnhead { fill: #B3261E; }
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1D2433; }
    .title { font-size: 16px; font-weight: 600; }
    .h { font-size: 14px; font-weight: 600; }
    .muted { fill: #5B6478; }
    .warn { fill: #B3261E; }
    .small { font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161B26; stroke: #2E3546; }
      .box { fill: #1F2533; stroke: #E7EBF3; }
      .slow { fill: #3A1F22; stroke: #FF8A80; }
      .region { stroke: #A3ABBD; }
      .cell { fill: #161B26; stroke: #E7EBF3; }
      .backlog { fill: #3A1F22; stroke: #FF8A80; }
      .line { stroke: #E7EBF3; }
      .warnline { stroke: #FF8A80; }
      .head { fill: #E7EBF3; }
      .warnhead { fill: #FF8A80; }
      text { fill: #E7EBF3; }
      .muted { fill: #A3ABBD; }
      .warn { fill: #FF8A80; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="warnhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="519" rx="8"/>
  <text class="title" x="24" y="34">Coupled pipelines: two common ways a slow consumer affects the stream</text>
  <text class="muted small" x="24" y="54">Illustrative arrangements, not every design. Each ties the slow step to the stream in a different way.</text>

  <!-- Panel 1: consumer work inside the loop -->
  <text class="h" x="24" y="94">1. Consumer work inside the processing loop</text>
  <rect class="box" x="24" y="116" width="150" height="76" rx="6"/>
  <text x="99" y="142" text-anchor="middle">event source</text>
  <text class="muted small" x="99" y="161" text-anchor="middle">camera SDK, file,</text>
  <text class="muted small" x="99" y="177" text-anchor="middle">network: high rate</text>

  <rect class="backlog" x="196" y="164" width="44" height="12"/>
  <rect class="backlog" x="196" y="150" width="44" height="12"/>
  <rect class="backlog" x="196" y="136" width="44" height="12"/>
  <rect class="backlog" x="196" y="122" width="44" height="12"/>
  <text class="warn small" x="218" y="194" text-anchor="middle">backlog</text>
  <line class="line" x1="174" y1="154" x2="192" y2="154" marker-end="url(#a)"/>
  <line class="line" x1="240" y1="154" x2="282" y2="154" marker-end="url(#a)"/>

  <rect class="region" x="286" y="104" width="352" height="124" rx="8"/>
  <text class="muted small" x="298" y="122">one thread, one loop</text>
  <rect class="box" x="302" y="134" width="130" height="48" rx="6"/>
  <text x="367" y="155" text-anchor="middle">accumulate</text>
  <text class="muted small" x="367" y="172" text-anchor="middle">a batch of events</text>
  <line class="line" x1="432" y1="158" x2="470" y2="158" marker-end="url(#a)"/>
  <rect class="slow" x="474" y="134" width="150" height="48" rx="6"/>
  <text x="549" y="155" text-anchor="middle">consumer work</text>
  <text class="warn small" x="549" y="172" text-anchor="middle">display, model: slow</text>
  <path class="line" d="M549,182 L549,208 L367,208 L367,186" marker-end="url(#a)"/>
  <text class="muted small" x="458" y="222" text-anchor="middle">next batch only after the slow step</text>

  <text x="660" y="132">The loop takes new events only</text>
  <text x="660" y="150">between slow steps, so it runs at</text>
  <text x="660" y="168">the consumer's speed.</text>
  <text class="warn" x="660" y="194">Unread events wait upstream</text>
  <text class="warn" x="660" y="212">(backpressure) until the source's</text>
  <text class="warn" x="660" y="230">buffer is full; then they are lost.</text>

  <!-- Panel 2: a queue between producer and consumer -->
  <text class="h" x="24" y="282">2. A queue between producer and consumer</text>
  <rect class="box" x="24" y="304" width="150" height="76" rx="6"/>
  <text x="99" y="330" text-anchor="middle">event source</text>
  <text class="muted small" x="99" y="349" text-anchor="middle">camera SDK, file,</text>
  <text class="muted small" x="99" y="365" text-anchor="middle">network: high rate</text>
  <line class="line" x1="174" y1="342" x2="206" y2="342" marker-end="url(#a)"/>

  <rect class="box" x="210" y="304" width="150" height="76" rx="6"/>
  <text x="285" y="330" text-anchor="middle">producer</text>
  <text class="muted small" x="285" y="349" text-anchor="middle">accumulate, then</text>
  <text class="muted small" x="285" y="365" text-anchor="middle">enqueue a frame</text>
  <line class="line" x1="360" y1="342" x2="392" y2="342" marker-end="url(#a)"/>

  <rect class="cell" x="396" y="322" width="40" height="40"/>
  <rect class="cell" x="436" y="322" width="40" height="40"/>
  <rect class="cell" x="476" y="322" width="40" height="40"/>
  <rect class="cell" x="516" y="322" width="40" height="40"/>
  <rect class="cell" x="556" y="322" width="40" height="40"/>
  <text class="mono" x="416" y="347" text-anchor="middle">f6</text>
  <text class="mono" x="456" y="347" text-anchor="middle">f5</text>
  <text class="mono" x="496" y="347" text-anchor="middle">f4</text>
  <text class="mono" x="536" y="347" text-anchor="middle">f3</text>
  <text class="mono" x="576" y="347" text-anchor="middle">f2</text>
  <text class="muted small" x="496" y="312" text-anchor="middle">queue: newest on the left</text>
  <line class="warnline" x1="436" y1="376" x2="398" y2="376" marker-end="url(#w)"/>
  <text class="warn small" x="442" y="380">grows while the consumer lags</text>
  <line class="line" x1="596" y1="342" x2="628" y2="342" marker-end="url(#a)"/>

  <rect class="slow" x="632" y="304" width="150" height="76" rx="6"/>
  <text x="707" y="330" text-anchor="middle">slow consumer</text>
  <text class="warn small" x="707" y="349" text-anchor="middle">works on f1, the</text>
  <text class="warn small" x="707" y="365" text-anchor="middle">oldest frame</text>

  <text x="24" y="420"><tspan font-weight="600">Unbounded:</tspan> memory grows without limit, and the consumer works on ever older frames, so its view of the</text>
  <text x="24" y="438">sensor falls further behind the stream (stale state).</text>
  <text x="24" y="464"><tspan font-weight="600">Bounded and blocking:</tspan> the producer waits while the queue is full, which is backpressure again.</text>
  <text x="24" y="490"><tspan font-weight="600">Bounded and dropping:</tspan> memory stays fixed; which frames the consumer sees depends on the queue's policy.</text>
</svg>
