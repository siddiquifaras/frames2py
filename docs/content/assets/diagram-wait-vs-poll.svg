<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Polling with snapshot() against waiting with wait_for_newer()</title>
  <desc id="desc">An idealised timeline. The producer publishes sequences 4 to 9 at 0, 16, 32, 48, 64 and 80 ms. A polling consumer calls snapshot() every 20 ms, at 10, 30, 50, 70 and 90 ms, and gets 4, 5, 7, 8 and 9: each state up to one poll interval late, and sequence 6 is never seen. A waiting consumer calls wait_for_newer(4) at 2 ms and is released by publication 5 at 16 ms, handles it until 26 ms, waits with 5 and is released by publication 6 at 32 ms, handles 6 until 70 ms while 7 and 8 are published without waking it, then wait_for_newer(6) returns 8 at once and 7 is skipped. It handles 8 until 78 ms, waits with 8 and is released by publication 9 at 80 ms. Each publication releases only the waiters registered before it, one lock release each, on the publishing thread.</desc>
  <style>
    .bg { fill: #FFFFFF; stroke: #D5DAE5; }
    .axis { stroke: #5B6478; stroke-width: 1; }
    .grid { stroke: #D5DAE5; stroke-width: 1; stroke-dasharray: 3 4; }
    .pub { stroke: #1D2433; stroke-width: 2; }
    .poll { fill: #FFFFFF; stroke: #A87500; stroke-width: 1.8; }
    .wait { fill: #EAF0FE; stroke: #3160F0; stroke-width: 1.2; }
    .work { fill: #3160F0; }
    .wake { fill: none; stroke: #3160F0; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .late { fill: none; stroke: #A87500; stroke-width: 1.2; }
    .wakehead { fill: #3160F0; }
    .latehead { fill: #A87500; }
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; fill: #1D2433; }
    .title { font-size: 22px; font-weight: 600; }
    .h { font-weight: 600; }
    .muted { fill: #5B6478; }
    .accent { fill: #3160F0; }
    .on { fill: #8A5F00; }
    .worktext { fill: #FFFFFF; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 6px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161B26; stroke: #2E3546; }
      .axis { stroke: #A3ABBD; }
      .grid { stroke: #2E3546; }
      .pub { stroke: #E7EBF3; }
      .poll { fill: #161B26; stroke: #F2A900; }
      .wait { fill: #1C2A4D; stroke: #6A8DFF; }
      .work { fill: #6A8DFF; }
      .wake { stroke: #6A8DFF; }
      .late { stroke: #F2A900; }
      .wakehead { fill: #6A8DFF; }
      .latehead { fill: #F2A900; }
      text { fill: #E7EBF3; }
      .muted { fill: #A3ABBD; }
      .accent { fill: #6A8DFF; }
      .on { fill: #F2A900; }
      .worktext { fill: #161B26; }
      .halo { stroke: #161B26; }
    }
  </style>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="wakehead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="latehead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- time scale: x = 260 + 7 * ms -->
  <rect class="bg" x="0.5" y="0.5" width="959" height="629" rx="8"/>
  <text class="title" x="24" y="38">Polling against waiting: the same publications, two consumers</text>
  <text class="muted" x="24" y="66">Idealised timeline: one publication every 16 ms, numbered by its sequence.</text>

  <!-- vertical guides at each publication -->
  <line class="grid" x1="260" y1="112" x2="260" y2="440"/>
  <line class="grid" x1="372" y1="112" x2="372" y2="440"/>
  <line class="grid" x1="484" y1="112" x2="484" y2="440"/>
  <line class="grid" x1="596" y1="112" x2="596" y2="440"/>
  <line class="grid" x1="708" y1="112" x2="708" y2="440"/>
  <line class="grid" x1="820" y1="112" x2="820" y2="440"/>

  <!-- lane 1: producer -->
  <text class="h" x="24" y="124">producer</text>
  <text class="muted" x="24" y="146">publications</text>
  <line class="axis" x1="260" y1="128" x2="936" y2="128"/>
  <line class="pub" x1="260" y1="110" x2="260" y2="128"/><text class="mono" x="260" y="102" text-anchor="middle">4</text>
  <line class="pub" x1="372" y1="110" x2="372" y2="128"/><text class="mono" x="372" y="102" text-anchor="middle">5</text>
  <line class="pub" x1="484" y1="110" x2="484" y2="128"/><text class="mono" x="484" y="102" text-anchor="middle">6</text>
  <line class="pub" x1="596" y1="110" x2="596" y2="128"/><text class="mono" x="596" y="102" text-anchor="middle">7</text>
  <line class="pub" x1="708" y1="110" x2="708" y2="128"/><text class="mono" x="708" y="102" text-anchor="middle">8</text>
  <line class="pub" x1="820" y1="110" x2="820" y2="128"/><text class="mono" x="820" y="102" text-anchor="middle">9</text>

  <!-- lane 2: polling -->
  <text class="h" x="24" y="208">polling consumer</text>
  <text class="mono" x="24" y="232">snapshot()</text>
  <text class="muted" x="24" y="254">every 20 ms</text>
  <line class="axis" x1="260" y1="214" x2="936" y2="214"/>
  <circle class="poll" cx="330" cy="214" r="7"/><text class="mono on" x="330" y="244" text-anchor="middle">4</text>
  <circle class="poll" cx="470" cy="214" r="7"/><text class="mono on" x="470" y="244" text-anchor="middle">5</text>
  <circle class="poll" cx="610" cy="214" r="7"/><text class="mono on" x="610" y="244" text-anchor="middle">7</text>
  <circle class="poll" cx="750" cy="214" r="7"/><text class="mono on" x="750" y="244" text-anchor="middle">8</text>
  <circle class="poll" cx="890" cy="214" r="7"/><text class="mono on" x="890" y="244" text-anchor="middle">9</text>
  <path class="late" d="M376,188 L462,188" marker-end="url(#l)"/>
  <text class="on halo" x="380" y="180">5: seen 14 ms late</text>
  <text class="on halo" x="546" y="270" text-anchor="middle">6 never seen</text>

  <!-- lane 3: waiting -->
  <text class="h" x="24" y="348">waiting consumer</text>
  <text class="mono" x="24" y="372">wait_for_newer(last)</text>
  <text class="muted" x="24" y="394">then handles it</text>
  <rect class="wait" x="274" y="340" width="98" height="26"/>
  <rect class="work" x="372" y="340" width="70" height="26"/><text class="worktext" x="407" y="359" text-anchor="middle">5</text>
  <rect class="wait" x="442" y="340" width="42" height="26"/>
  <rect class="work" x="484" y="340" width="266" height="26"/><text class="worktext" x="617" y="359" text-anchor="middle">handles 6</text>
  <rect class="work" x="750" y="340" width="56" height="26"/><text class="worktext" x="778" y="359" text-anchor="middle">8</text>
  <rect class="wait" x="806" y="340" width="14" height="26"/>
  <rect class="work" x="820" y="340" width="70" height="26"/><text class="worktext" x="855" y="359" text-anchor="middle">9</text>

  <path class="wake" d="M372,130 L372,336" marker-end="url(#k)"/>
  <path class="wake" d="M484,130 L484,336" marker-end="url(#k)"/>
  <path class="wake" d="M820,130 L820,336" marker-end="url(#k)"/>

  <text class="accent halo" x="323" y="392" text-anchor="middle">blocked (registered)</text>
  <text class="accent halo" x="652" y="302" text-anchor="middle">7 and 8 are published while it works:</text>
  <text class="accent halo" x="652" y="324" text-anchor="middle">it isn't registered, so not woken; nothing is queued</text>
  <text class="accent halo" x="750" y="392" text-anchor="middle">wait_for_newer(6) returns 8 at once;</text>
  <text class="accent halo" x="750" y="414" text-anchor="middle">7 is skipped</text>

  <!-- time axis -->
  <line class="axis" x1="260" y1="440" x2="936" y2="440"/>
  <text class="muted" x="260" y="464" text-anchor="middle">0</text>
  <text class="muted" x="372" y="464" text-anchor="middle">16</text>
  <text class="muted" x="484" y="464" text-anchor="middle">32</text>
  <text class="muted" x="596" y="464" text-anchor="middle">48</text>
  <text class="muted" x="708" y="464" text-anchor="middle">64</text>
  <text class="muted" x="820" y="464" text-anchor="middle">80</text>
  <text class="muted" x="914" y="464" text-anchor="middle">96 ms</text>

  <!-- legend and notes -->
  <rect class="wait" x="24" y="490" width="26" height="16"/><text x="60" y="504">blocked in wait_for_newer()</text>
  <rect class="work" x="330" y="490" width="26" height="16"/><text x="366" y="504">handling a snapshot</text>
  <circle class="poll" cx="37" cy="528" r="7"/><text x="60" y="534">a snapshot() call and the sequence it got</text>
  <text x="24" y="572">Each publication releases only the waiters registered before it, one lock release each,</text>
  <text x="24" y="594">on the publishing thread; more waiters mean more work per publication. Polling sees a</text>
  <text x="24" y="616">state up to one poll interval late, and can miss or re-read publications.</text>
</svg>
