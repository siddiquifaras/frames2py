# Documentation site. Build from the repository root:
#   uv run --only-group docs zensical build -f docs/mkdocs.yml --strict
# The configuration stays within what Zensical 0.0.66 and MkDocs 1.6.1 + Material 9.7.7 both read.

site_name: Frames2Py
site_description: Live, decoupled observation of event-camera state.
site_url: https://siddiquifaras.github.io/frames2py/
repo_url: https://github.com/siddiquifaras/frames2py
repo_name: siddiquifaras/frames2py
edit_uri: ""
copyright: Frames2Py is licensed under the Apache License 2.0.

docs_dir: content
site_dir: site

theme:
  name: material
  logo: assets/frames2py-mark-dark.svg
  favicon: assets/frames2py-favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/snippets]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            show_if_no_docstring: false
            heading_level: 2

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Introduction:
      - Overview: index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Concepts: getting-started/concepts.md
  - Core:
      - Architecture: core/architecture.md
      - Accumulator: core/accumulator.md
      - Engine: core/engine.md
      - Event contract: core/event-contract.md
      - Kernels: core/kernels.md
      - Temporal semantics table: core/temporal-semantics.md
      - Snapshots and consumers: core/snapshots.md
      - Lifecycle and threads: core/lifecycle.md
  - Data:
      - Adapters: data/adapters.md
      - EVT 2.0 and 3.0: data/evt.md
      - AEDAT 4.0: data/aedat4.md
      - HDF5: data/hdf5.md
      - Recorder: data/recorder.md
      - Replay: data/replay.md
  - Consumers:
      - Viewer: consumers/viewer.md
      - Writing a consumer: consumers/writing-a-consumer.md
      - PyTorch: consumers/pytorch.md
  - Reference:
      - API:
          - Core: reference/api/core.md
          - Kernels: reference/api/kernels.md
          - Publication: reference/api/publish.md
          - Adapters: reference/api/adapters.md
          - Recorder, viewer and replay: reference/api/tools.md
      - Supported Python and platforms: reference/support.md
      - Performance: reference/performance.md
      - Benchmark methodology: reference/methodology.md
  - Development:
      - Testing: development/testing.md
      - Contributing: development/contributing.md
  - Changelog: changelog.md
