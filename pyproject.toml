[build-system]
requires = ["uv_build==0.12.20"]
build-backend = "uv_build"

[project]
name = "frames2py"
version = "1.0.0"
description = "Decoupled observation of continuously accumulated event-camera state."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Faras Siddiqui" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
keywords = [
    "event-camera",
    "dvs",
    "neuromorphic",
    "event-driven",
    "accumulation",
]
dependencies = [
    "numpy>=2.4",
]

[project.optional-dependencies]
evt = []
aedat4 = ["dv-processing>=2.0.4"]
hdf5 = ["h5py>=3.16", "hdf5plugin>=7.1"]
recorder = ["h5py>=3.16", "hdf5plugin>=7.1"]
viewer = ["pyglet>=2.1.16"]

[dependency-groups]
test = [
    "hypothesis>=6.168.3",
    "pytest>=7.4",
    "pytest-timeout>=2.2",
]
dev = [
    { include-group = "test" },
    "mypy>=1.8",
    "pyflakes>=4.0",
]
docs = [
    "zensical==0.0.66",
    "mkdocstrings-python==2.0.9",
]

[project.urls]
Homepage = "https://github.com/siddiquifaras/frames2py"
Documentation = "https://siddiquifaras.github.io/frames2py/"
Repository = "https://github.com/siddiquifaras/frames2py"
Issues = "https://github.com/siddiquifaras/frames2py/issues"

[tool.uv.build-backend]
# uv_build does not read .gitignore; keep Finder metadata out of the wheel and sdist.
source-exclude = [".DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
